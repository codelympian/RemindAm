services:
  postgres:
    image: postgres:16-alpine
    container_name: remindam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: remindam
      POSTGRES_PASSWORD: remindam
      POSTGRES_DB: remindam
    ports:
      - '5432:5432'
    volumes:
      - remindam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U remindam -d remindam']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  remindam_pgdata:
